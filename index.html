<meta charset="UTF-8">
<title>Сыбайлас жемқорлыққа жауапкершілік</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Golos+Text:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#10172a;
  --ink-2:#182238;
  --ink-3:#202c47;
  --ink-4:#293656;
  --line:rgba(243,234,217,0.14);
  --line-strong:rgba(243,234,217,0.26);
  --paper:#f4ecdd;
  --paper-dim:rgba(244,236,221,0.72);
  --paper-faint:rgba(244,236,221,0.48);
  --disc:#1D4E89;
  --disc-soft:rgba(29,78,137,0.14);
  --crim:#B3261E;
  --crim-soft:rgba(179,38,30,0.14);
  --admin:#A35C00;
  --admin-soft:rgba(163,92,0,0.14);
  --game:#1E7A49;
  --game-soft:rgba(30,122,73,0.14);
  --violet:#5B3A99;
  --violet-soft:rgba(91,58,153,0.14);
  --neutral:#A35C00;
  --neutral-soft:rgba(163,92,0,0.14);
  --shadow:0 24px 70px rgba(0,0,0,0.4);
  --radius:18px;
}
:root[data-theme="light"]{
  --ink:#F3EEE3;
  --ink-2:#FFFFFF;
  --ink-3:#EFE7D4;
  --ink-4:#D6CDB8;
  --line:#D6CDB8;
  --line-strong:#C2B595;
  --paper:#0B1220;
  --paper-dim:#1F2937;
  --paper-faint:#374151;
  --shadow:0 10px 30px rgba(15,23,42,0.12);
}
*{box-sizing:border-box;}
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--ink);
  color:var(--paper);
  transition:background-color .5s ease, color .5s ease;
}
body{
  font-family:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3{
  font-family:'Spectral',Georgia,'Times New Roman',serif;
  font-weight:800;
  color:var(--paper);
  margin:0;
  text-wrap:balance;
}
p{margin:0;}
button{font-family:inherit;}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;}
::selection{background:var(--admin);color:var(--ink);}
:focus-visible{outline:2px solid var(--admin);outline-offset:3px;border-radius:4px;}

#bg-host{position:fixed;inset:0;z-index:0;background:var(--ink);}
#bg-host canvas{display:block;width:100%;height:100%;}
#vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 60% at 50% 42%, rgba(16,23,42,0) 0%, rgba(16,23,42,0.22) 62%, rgba(16,23,42,0.62) 100%),
    linear-gradient(to bottom, rgba(16,23,42,0.32) 0%, rgba(16,23,42,0) 16%, rgba(16,23,42,0) 76%, rgba(16,23,42,0.42) 100%);
  transition:opacity .5s ease;
}

#app{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;}

.topbar{
  position:relative;z-index:3;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 28px 0;
  gap:16px;
}
.progress{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(236,228,211,0.08);}
.progress-fill{height:100%;width:0%;background:var(--accent,var(--admin));transition:width .4s ease, background-color .5s ease;}

.chip{
  display:inline-flex;align-items:center;gap:8px;
  font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--paper-dim);
  background:var(--ink-2);border:1px solid var(--line);
  padding:7px 13px;border-radius:999px;
  white-space:nowrap;
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--admin));flex:none;transition:background-color .5s ease;}

.legend{display:flex;gap:6px;align-items:center;}
.legend .lg{
  display:flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:999px;
  border:1px solid var(--line);background:var(--ink-2);
  font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--paper-faint);
  transition:all .3s ease;opacity:.55;
}
.legend .lg b{width:6px;height:6px;border-radius:50%;flex:none;}
.legend .lg.on{opacity:1;color:var(--paper);border-color:var(--line-strong);}

.counter{font-size:.78rem;color:var(--paper-dim);letter-spacing:.04em;flex:none;}

main#stage{
  flex:1;display:flex;align-items:center;justify-content:center;
  padding:18px 28px;min-height:0;position:relative;
}
.card{
  position:relative;
  width:100%;max-width:1080px;max-height:100%;
  overflow-y:auto;
  padding:clamp(28px,4vw,56px) clamp(28px,5vw,64px);
  opacity:0;transform:translateY(10px);
  transition:opacity .32s ease, transform .32s ease;
  scrollbar-width:thin;scrollbar-color:var(--ink-4) transparent;
  text-shadow:0 2px 18px rgba(6,10,18,0.8), 0 1px 4px rgba(6,10,18,0.85);
}
.card::before{
  content:'';
  position:absolute;
  inset:clamp(-36px,-5vw,-14px) clamp(-48px,-7vw,-18px);
  background:radial-gradient(ellipse 62% 66% at 50% 40%, rgba(8,12,20,0.5) 0%, rgba(8,12,20,0.24) 50%, rgba(8,12,20,0) 78%);
  z-index:-1;pointer-events:none;
}
.card.in{opacity:1;transform:translateY(0);}
.card::-webkit-scrollbar{width:8px;}
.card::-webkit-scrollbar-thumb{background:var(--ink-4);border-radius:8px;}

.card-title::before{
  background:
    radial-gradient(ellipse 50% 60% at 78% 45%, rgba(232,189,108,0.16) 0%, rgba(232,189,108,0) 70%),
    radial-gradient(ellipse 62% 66% at 50% 40%, rgba(8,12,20,0.5) 0%, rgba(8,12,20,0.24) 50%, rgba(8,12,20,0) 78%);
}
.hero-illustration{
  position:absolute;right:clamp(-40px,-3vw,10px);top:50%;transform:translateY(-50%);
  width:clamp(220px,26vw,380px);height:clamp(220px,26vw,380px);
  color:var(--admin);opacity:.14;pointer-events:none;z-index:-1;
}
.hero-illustration svg{width:100%;height:100%;}
@media (max-width:860px){.hero-illustration{display:none;}}

.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-family:'JetBrains Mono',monospace;font-size:.82rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent,var(--admin));margin-bottom:16px;transition:color .5s ease;
}
.eyebrow::before{content:'';width:18px;height:1px;background:var(--accent,var(--admin));transition:background-color .5s ease;}

h2.slide-title{font-size:clamp(1.8rem,3.1vw,2.6rem);line-height:1.2;letter-spacing:-.01em;}
h1.hero-title{font-size:clamp(2.5rem,5.4vw,4.3rem);line-height:1.1;letter-spacing:-.015em;}
.lede{font-size:1.4rem;line-height:1.6;color:var(--paper-dim);max-width:64ch;margin-top:16px;}
.body-text{font-size:1.4rem;line-height:1.6;color:var(--paper-dim);max-width:68ch;}
.body-text strong{color:var(--paper);font-weight:600;}

.stack{display:flex;flex-direction:column;gap:22px;margin-top:22px;}
.row{display:flex;gap:18px;flex-wrap:wrap;}

.kicker-roadmap{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px;}
.rm-chip{
  display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--ink-2);
}
.rm-chip .num{font-family:'JetBrains Mono',monospace;font-size:.92rem;font-weight:700;}
.rm-chip .lbl{font-size:1rem;font-weight:700;color:var(--paper);}
.rm-chip.disc{border-color:var(--disc);} .rm-chip.disc .num{color:var(--disc);}
.rm-chip.crim{border-color:var(--crim);} .rm-chip.crim .num{color:var(--crim);}
.rm-chip.admin{border-color:var(--admin);} .rm-chip.admin .num{color:var(--admin);}

.ic{width:28px;height:28px;color:var(--accent,var(--admin));opacity:.9;flex:none;}
.ic svg{width:100%;height:100%;}

.grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:24px;}
.gc{
  border:1px solid var(--line);background:var(--ink-2);border-radius:14px;padding:20px 20px;
  border-left:3px solid var(--accent,var(--admin));
}
.gc .ic{margin-bottom:12px;}
.gc h4{font-family:'Golos Text';font-size:1.06rem;font-weight:700;margin:0 0 7px;color:var(--paper);}
.gc p{font-size:.98rem;line-height:1.58;color:var(--paper-dim);}

.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:24px;}
.codex-item{
  border:1px solid var(--line);border-radius:12px;padding:16px 18px;background:var(--ink-2);
  transition:transform .2s ease,border-color .2s ease;
}
.codex-item:hover{transform:translateY(-2px);border-color:var(--line-strong);}
.codex-item .ic{width:20px;height:20px;opacity:.55;margin-bottom:8px;}
.codex-item .n{font-family:'JetBrains Mono',monospace;font-size:1.44rem;font-weight:700;color:var(--accent,var(--admin));}
.codex-item .t{font-size:.94rem;color:var(--paper-dim);margin-top:4px;line-height:1.42;}

.ladder{display:flex;flex-direction:column;gap:0;margin-top:24px;position:relative;padding-left:26px;}
.ladder::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:1px;background:var(--line-strong);}
.rung{display:flex;align-items:baseline;gap:14px;padding:11px 0;position:relative;}
.rung::before{
  content:'';position:absolute;left:-26px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;border-radius:50%;background:var(--accent,var(--admin));border:2px solid var(--accent,var(--admin));
}
.rung.final::before{width:15px;height:15px;left:-27px;box-shadow:0 0 0 3px var(--accent-soft,var(--admin-soft));}
.rung .idx{font-family:'JetBrains Mono',monospace;font-size:.86rem;font-weight:700;color:var(--paper-faint);width:20px;flex:none;}
.rung .lbl{font-size:1.06rem;font-weight:600;color:var(--paper-dim);}
.rung.final .lbl{color:var(--paper);font-weight:800;}
.rung .tag{margin-left:auto;font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent,var(--admin));opacity:0;}
.rung.final .tag{opacity:1;}

.example{
  margin-top:22px;border-radius:14px;border:1px solid var(--line);
  background:linear-gradient(135deg, var(--accent-soft,var(--admin-soft)) 0%, transparent 60%), var(--ink-2);
  border-left:3px solid var(--accent,var(--admin));
  padding:18px 22px;
}
.example .tag{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent,var(--admin));}
.example .tag svg{width:16px;height:16px;flex:none;}
.example p{margin-top:10px;font-size:1.06rem;line-height:1.62;color:var(--paper);font-style:italic;}
.example .outcome{margin-top:12px;font-style:normal;font-size:.96rem;color:var(--paper-dim);}
.example .outcome strong{color:var(--accent,var(--admin));font-style:normal;}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px;}
@media (max-width:720px){.twocol{grid-template-columns:1fr;}}

table.cmp{width:100%;border-collapse:collapse;margin-top:22px;font-size:1.02rem;border:1px solid var(--line);}
table.cmp th,table.cmp td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);}
table.cmp th{color:var(--paper-faint);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
table.cmp td{color:var(--paper-dim);}
table.cmp td.hl{color:var(--accent,var(--admin));font-weight:800;}
.tbl-wrap{overflow-x:auto;}

.flowsteps{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap;align-items:stretch;}
.fstep{flex:1;min-width:170px;border:1px solid var(--line);background:var(--ink-2);border-radius:12px;padding:18px;position:relative;}
.fstep .n{font-family:'JetBrains Mono',monospace;color:var(--accent,var(--admin));font-size:.86rem;}
.fstep p{margin-top:7px;font-size:.96rem;color:var(--paper-dim);line-height:1.52;}
.farrow{display:flex;align-items:center;color:var(--paper-faint);font-size:1.2rem;}
@media (max-width:720px){.farrow{display:none;}}

.hotline{
  margin-top:24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;
  border:1px solid var(--line-strong);border-radius:16px;padding:22px 28px;background:var(--ink-2);
}
.hotline .ic{width:40px;height:40px;color:var(--admin);opacity:1;}
.hotline .num{font-family:'JetBrains Mono',monospace;font-size:2.7rem;font-weight:700;color:var(--admin);line-height:1;}
.hotline .txt{font-size:1rem;color:var(--paper-dim);max-width:42ch;}

.scorecard{display:grid;grid-template-columns:1fr;gap:12px;margin-top:22px;}
.sc-row{display:grid;grid-template-columns:130px 1fr;gap:18px;border:1px solid var(--line);border-radius:12px;padding:16px 20px;background:var(--ink-2);align-items:center;}
.sc-row .k{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
.sc-row.disc{border-left:3px solid var(--disc);} .sc-row.disc .k{color:var(--disc);}
.sc-row.admin{border-left:3px solid var(--admin);} .sc-row.admin .k{color:var(--admin);}
.sc-row.crim{border-left:3px solid var(--crim);} .sc-row.crim .k{color:var(--crim);}
.sc-row .v{font-size:.96rem;color:var(--paper-dim);line-height:1.5;}
.sc-row .v b{color:var(--paper);}

.card-board{
  max-width:1360px;width:96%;height:100%;
  display:flex;flex-direction:column;
  padding:clamp(18px,2.2vw,32px) clamp(18px,2.6vw,38px);
}
.board-wrap{display:flex;flex-direction:column;gap:16px;height:100%;min-height:0;}
.board-teams{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;flex:none;}
.team-panel{
  border:1px solid var(--line-strong);border-top:3px solid var(--tc,var(--admin));
  background:var(--ink-2);border-radius:14px;padding:12px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
.tp-name{font-size:.84rem;color:var(--paper-dim);font-weight:600;}
.tp-score{font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:700;color:var(--tc,var(--admin));min-width:3ch;text-align:center;}
.tp-ctrl{display:flex;gap:6px;}
.tp-btn{
  font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;
  border:1px solid var(--line-strong);background:var(--ink-3);color:var(--paper-dim);
  border-radius:8px;padding:6px 9px;cursor:pointer;transition:all .15s ease;
}
.tp-btn:hover{border-color:var(--tc,var(--admin));color:var(--tc,var(--admin));}

.board-grid{
  flex:1;min-height:0;display:grid;
  grid-template-columns:repeat(5,1fr);
  grid-template-rows:auto repeat(5,1fr);
  gap:8px;
}
.board-cat{
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:clamp(.82rem,1.3vw,1.05rem);font-weight:700;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ac,var(--admin));background:var(--ink-2);border:1px solid var(--line-strong);
  border-radius:10px;padding:12px 6px;line-height:1.28;
  min-width:0;overflow-wrap:break-word;word-break:break-word;
}
.board-cell{
  font-family:'JetBrains Mono',monospace;font-weight:700;
  font-size:clamp(1.6rem,3.2vw,2.5rem);color:var(--ac,var(--admin));
  background:var(--ink-2);border:1px solid var(--line);border-radius:12px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all .15s ease;min-height:0;min-width:0;
}
.board-cell:hover{border-color:var(--ac,var(--admin));background:var(--ink-3);transform:translateY(-2px);}
.board-cell.answered{color:var(--paper-faint);opacity:.26;cursor:default;border-color:var(--line);background:transparent;}
.board-cell.answered:hover{transform:none;border-color:var(--line);}

.board-overlay{
  position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,19,0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;transition:opacity .25s ease;padding:32px;
}
.board-overlay.open{opacity:1;pointer-events:auto;}
.bo-card{
  width:100%;max-width:820px;background:var(--ink-2);border:1px solid var(--line-strong);
  border-radius:20px;box-shadow:var(--shadow);padding:clamp(26px,4vw,52px);text-align:center;
}
.bo-tag{font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ac,var(--admin));margin-bottom:18px;}
.bo-q{font-family:'Spectral';font-weight:600;font-size:clamp(1.3rem,3vw,2rem);line-height:1.38;text-wrap:balance;}
.bo-a{
  margin-top:0;padding-top:0;border-top:1px solid transparent;
  font-size:1.08rem;color:var(--game);font-weight:600;line-height:1.55;
  max-height:0;opacity:0;overflow:hidden;transition:all .3s ease;
}
.bo-a.show{margin-top:22px;padding-top:22px;border-top-color:var(--line);max-height:300px;opacity:1;}
.bo-actions{display:flex;gap:12px;justify-content:center;margin-top:28px;}
@media (max-width:760px){
  .board-teams{grid-template-columns:1fr;gap:8px;}
  .board-grid{gap:5px;}
  .board-cat{font-size:.6rem;letter-spacing:0;padding:8px 3px;}
  .board-cell{font-size:1.3rem;border-radius:9px;}
}

.gameintro-steps{display:flex;flex-direction:column;gap:12px;margin-top:24px;}
.gi{display:flex;gap:16px;align-items:flex-start;}
.gi .n{font-family:'JetBrains Mono',monospace;color:var(--game);font-weight:700;flex:none;width:24px;font-size:1.05rem;}
.gi p{font-size:1.04rem;color:var(--paper-dim);line-height:1.58;}

.final-cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap;}
.btn{
  font-family:'Golos Text';font-weight:600;font-size:.96rem;
  border:1px solid var(--line-strong);background:var(--ink-3);color:var(--paper);
  padding:13px 22px;border-radius:999px;cursor:pointer;transition:all .18s ease;
}
.btn:hover{border-color:var(--admin);color:var(--admin);}
.btn.primary{background:var(--admin);color:#FFFFFF;border-color:var(--admin);}
.btn.primary:hover{opacity:.88;color:var(--ink);}

.navbar{
  position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:18px;
  padding:16px 28px 22px;
}
.nav-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid var(--line-strong);background:var(--ink-2);
  color:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;
  transition:all .18s ease;
}
.nav-btn:hover{border-color:var(--accent,var(--admin));color:var(--accent,var(--admin));}
.nav-btn:disabled{opacity:.3;cursor:default;}
.nav-btn:disabled:hover{border-color:var(--line-strong);color:var(--paper);}
.nav-btn svg{width:18px;height:18px;}
.nav-hint{font-size:.72rem;color:var(--paper-faint);letter-spacing:.04em;white-space:nowrap;}
@media (max-width:560px){.nav-hint{display:none;}}

#scoreboard{
  position:fixed;top:20px;right:28px;z-index:4;
  background:rgba(17,26,40,0.88);backdrop-filter:blur(10px);
  border:1px solid var(--line-strong);border-radius:14px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;min-width:168px;
  opacity:0;transform:translateY(-8px);pointer-events:none;
  transition:opacity .3s ease, transform .3s ease;
}
#scoreboard.visible{opacity:1;transform:translateY(0);pointer-events:auto;}
#scoreboard .sb-title{font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-faint);margin-bottom:2px;}
.sb-team{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sb-team .name{font-size:.82rem;color:var(--paper-dim);}
.sb-team .ctrl{display:flex;align-items:center;gap:6px;}
.sb-team .score{font-family:'JetBrains Mono',monospace;font-weight:700;min-width:22px;text-align:center;}
.sb-btn{
  width:20px;height:20px;border-radius:50%;border:1px solid var(--line-strong);background:var(--ink-3);
  color:var(--paper-dim);font-size:.75rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.sb-btn:hover{border-color:var(--game);color:var(--game);}

@media (max-width:680px){
  .topbar{padding:14px 16px 0;}
  .legend .lg span.txt{display:none;}
  main#stage{padding:10px 14px;}
  .card{padding:24px 20px;}
  #scoreboard{right:16px;top:14px;min-width:150px;}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}

/* ---------- light theme: high-contrast ivory + white cards ---------- */

      var overlay = el.querySelector('#boardOverlay');
      var boTag = el.querySelector('#boTag');
      var boQ = el.querySelector('#boQ');
      var boA = el.querySelector('#boA');
      var boShow = el.querySelector('#boShow');
      var boClose = el.querySelector('#boClose');

      function closeOverlay(){
        overlay.classList.remove('open');
        var id = overlay.getAttribute('data-cell-id');
        if(id){
          answeredCells[id] = true;
          saveAnswered();
          var cell = el.querySelector('.board-cell[data-id="'+id+'"]');
          if(cell) cell.classList.add('answered');
        }
      }
      boShow.onclick = function(){ boA.classList.add('show'); };
      boClose.onclick = closeOverlay;
      overlay.__close = closeOverlay;
      overlay.__reveal = function(){ boA.classList.add('show'); };

      el.querySelectorAll('.board-cell').forEach(function(cell){
        var id = cell.getAttribute('data-id');
        if(answeredCells[id]) cell.classList.add('answered');
        cell.addEventListener('click', function(){
          if(answeredCells[id]) return;
          var catKey = cell.getAttribute('data-cat');
          var ridx = parseInt(cell.getAttribute('data-idx'),10);
          var cat = CATEGORIES.filter(function(c){return c.key===catKey;})[0];
          var item = cat.items[ridx];
          overlay.style.setProperty('--ac','var(--'+cat.accent+')');
          overlay.setAttribute('data-cell-id', id);
          boTag.textContent = cat.name.toUpperCase()+' · '+item.val;
          boQ.textContent = item.q;
          boA.textContent = item.a;
          boA.classList.remove('show');
          overlay.classList.add('open');
        });
      });
    }
    var restartBtn = el.querySelector('#restartBtn');
    if(restartBtn) restartBtn.addEventListener('click', function(){ go(0); });
    var resetScoreBtn = el.querySelector('#resetScoreBtn');
    if(resetScoreBtn) resetScoreBtn.addEventListener('click', function(){ resetGame(); });
  }

  var renderTimer = null;
  function render(){
    var slide = SLIDES[idx];
    cardEl.classList.remove('in');
    if(renderTimer) clearTimeout(renderTimer);
    renderTimer = setTimeout(function(){
      cardEl.className = 'card'+(slide.kind==='board' ? ' card-board' : '')+(slide.kind==='title' ? ' card-title' : '');
      cardEl.innerHTML = slide.render();
      cardEl.scrollTop = 0;
      wire(slide, cardEl);
      requestAnimationFrame(function(){ cardEl.classList.add('in'); });
    }, 140);

    var acc = ACCENTS[slide.chapter] || ACCENTS.neutral;
    document.documentElement.style.setProperty('--accent', acc.css);
    document.documentElement.style.setProperty('--accent-soft', acc.soft);
    document.documentElement.setAttribute('data-theme', slide.theme || 'dark');
    progressFill.style.width = (100*(idx+1)/total)+'%';
    chapterLabel.textContent = CHAPTER_LABEL[slide.chapter] || 'Кіріспе';
    slideCounter.textContent = pad(idx+1)+' / '+pad(total);
    legendEls.forEach(function(l){ l.classList.toggle('on', l.getAttribute('data-k')===slide.chapter); });
    scoreboard.classList.toggle('visible', slide.chapter==='game' && slide.kind!=='board');
    prevBtn.disabled = idx===0;
    nextBtn.disabled = idx===total-1;
    if(window.__bg){
      window.__bg.setAccent(acc.hex);
      window.__bg.setTheme(slide.theme || 'dark');
    }
  }

  function go(i){
    idx = Math.max(0, Math.min(total-1, i));
    render();
  }
  function next(){ if(idx<total-1) go(idx+1); }
  function prev(){ if(idx>0) go(idx-1); }

  prevBtn.addEventListener('click', prev);
  nextBtn.addEventListener('click', next);
  window.addEventListener('keydown', function(e){
    var openOverlay = document.querySelector('.board-overlay.open');
    if(openOverlay){
      if(e.key==='Escape' || e.key==='Enter'){ e.preventDefault(); openOverlay.__close(); }
      else if(e.key===' '){ e.preventDefault(); openOverlay.__reveal(); }
      return;
    }
    if(e.key==='ArrowRight' || e.key===' ' || e.key==='PageDown'){ e.preventDefault(); next(); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp'){ e.preventDefault(); prev(); }
    else if(e.key==='Home'){ e.preventDefault(); go(0); }
    else if(e.key==='End'){ e.preventDefault(); go(total-1); }
  });

  var SCORE_KEY = 'corruption-board-scores-v1';
  var ANSWERED_KEY = 'corruption-board-answered-v1';
  var scores = {A:0,B:0,C:0};
  var answeredCells = {};
  try{
    var savedScores = JSON.parse(localStorage.getItem(SCORE_KEY) || 'null');
    if(savedScores) scores = savedScores;
    answeredCells = JSON.parse(localStorage.getItem(ANSWERED_KEY) || '{}') || {};
  }catch(e){}
  function saveScores(){ try{ localStorage.setItem(SCORE_KEY, JSON.stringify(scores)); }catch(e){} }
  function saveAnswered(){ try{ localStorage.setItem(ANSWERED_KEY, JSON.stringify(answeredCells)); }catch(e){} }
  function renderScores(){
    document.querySelectorAll('[data-team]').forEach(function(row){
      var t = row.getAttribute('data-team');
      var scoreEl = row.querySelector('[data-score]');
      if(scoreEl) scoreEl.textContent = scores[t];
    });
  }
  function resetGame(){
    scores = {A:0,B:0,C:0};
    answeredCells = {};
    saveScores();
    saveAnswered();
    renderScores();
    document.querySelectorAll('.board-cell.answered').forEach(function(c){ c.classList.remove('answered'); });
  }
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.sb-btn, .tp-btn');
    if(!btn) return;
    var row = btn.closest('[data-team]');
    if(!row) return;
    var t = row.getAttribute('data-team');
    var d = parseInt(btn.getAttribute('data-d'),10);
    scores[t] = Math.max(0, scores[t]+d);
    saveScores();
    renderScores();
  });
  renderScores();

  render();

  function initBG(){
    if(typeof THREE==='undefined') return;
    var host = document.getElementById('bg-host');
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x10172a, 0.04);
    var camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 100);
    camera.position.set(0,0,17);

    var renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x10172a, 1);
    host.appendChild(renderer.domElement);

    function dotTexture(){
      var c = document.createElement('canvas'); c.width=64; c.height=64;
      var ctx = c.getContext('2d');
      var g = ctx.createRadialGradient(32,32,0,32,32,32);
      g.addColorStop(0,'rgba(255,255,255,1)');
      g.addColorStop(0.4,'rgba(255,255,255,0.7)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,64,64);
      return new THREE.CanvasTexture(c);
    }
    function beamTexture(){
      var c = document.createElement('canvas'); c.width=32; c.height=256;
      var ctx = c.getContext('2d');
      var g = ctx.createLinearGradient(0,0,0,256);
      g.addColorStop(0,'rgba(255,255,255,0)');
      g.addColorStop(0.5,'rgba(255,255,255,0.9)');
      g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.fillRect(0,0,32,256);
      return new THREE.CanvasTexture(c);
    }
    function ringTexture(){
      var c = document.createElement('canvas'); c.width=128; c.height=128;
      var ctx = c.getContext('2d');
      ctx.strokeStyle = 'rgba(255,255,255,1)';
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(64,64,48,0,Math.PI*2); ctx.stroke();
      return new THREE.CanvasTexture(c);
    }

    var N = 96;
    var positions = new Float32Array(N*3);
    var colors = new Float32Array(N*3);
    var baseColor = new THREE.Color(0x0B1220);
    var flaggedIdx = [];
    var tmp = new THREE.Color();

    for(var i=0;i<N;i++){
      var r, x,y,z;
      do{
        var theta = Math.random()*Math.PI*2;
        var phi = Math.acos(2*Math.random()-1);
        r = 7.5 + Math.random()*4.2;
        x = r*Math.sin(phi)*Math.cos(theta);
        y = r*Math.cos(phi)*0.62;
        z = r*Math.sin(phi)*Math.sin(theta)*0.9 - 2;
      } while(Math.abs(x)<6.5 && Math.abs(y)<4.2);
      positions[i*3]=x; positions[i*3+1]=y; positions[i*3+2]=z;
      tmp.copy(baseColor);
      colors[i*3]=tmp.r; colors[i*3+1]=tmp.g; colors[i*3+2]=tmp.b;
    }
    var flagCount = 12;
    while(flaggedIdx.length<flagCount){
      var fi = Math.floor(Math.random()*N);
      if(flaggedIdx.indexOf(fi)===-1) flaggedIdx.push(fi);
    }
    var isFlagged = new Array(N).fill(false);
    flaggedIdx.forEach(function(fi4){ isFlagged[fi4] = true; });

    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
    geo.setAttribute('color', new THREE.BufferAttribute(colors,3));
    var mat = new THREE.PointsMaterial({
      size:0.42, map:dotTexture(), transparent:true, vertexColors:true,
      depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true
    });
    var points = new THREE.Points(geo, mat);

    var linePositions = [];
    var K = 2;
    for(var a=0;a<N;a++){
      var dists = [];
      for(var b=0;b<N;b++){
        if(a===b) continue;
        var dx=positions[a*3]-positions[b*3], dy=positions[a*3+1]-positions[b*3+1], dz=positions[a*3+2]-positions[b*3+2];
        dists.push([b, dx*dx+dy*dy+dz*dz]);
      }
      dists.sort(function(p,q){return p[1]-q[1];});
      for(var k=0;k<K;k++){
        var bIdx = dists[k][0];
        linePositions.push(positions[a*3],positions[a*3+1],positions[a*3+2]);
        linePositions.push(positions[bIdx*3],positions[bIdx*3+1],positions[bIdx*3+2]);
      }
    }
    var lineGeo = new THREE.BufferGeometry();
    lineGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(linePositions),3));
    var lineMat = new THREE.LineBasicMaterial({color:0x8db4ca, transparent:true, opacity:0.13, blending:THREE.AdditiveBlending});
    var lines = new THREE.LineSegments(lineGeo, lineMat);

    var group = new THREE.Group();
    group.add(lines); group.add(points);
    group.rotation.x = 0.18;
    scene.add(group);

    var ringTex = ringTexture();
    var pingSprites = flaggedIdx.map(function(){
      var m = new THREE.SpriteMaterial({map:ringTex, color:0xA35C00, transparent:true, opacity:0, blending:THREE.AdditiveBlending, depthWrite:false});
      var s = new THREE.Sprite(m);
      s.scale.set(0.1,0.1,1);
      group.add(s);
      return s;
    });

    var beamMat = new THREE.SpriteMaterial({map:beamTexture(), color:0xA35C00, transparent:true, opacity:0.16, blending:THREE.AdditiveBlending, depthWrite:false});
    var beam = new THREE.Sprite(beamMat);
    beam.scale.set(26, 5, 1);
    beam.position.set(0,8,2);
    scene.add(beam);

    var beamMat2 = new THREE.SpriteMaterial({map:beamTexture(), color:0xA35C00, transparent:true, opacity:0.1, blending:THREE.AdditiveBlending, depthWrite:false, rotation:Math.PI/2});
    var beam2 = new THREE.Sprite(beamMat2);
    beam2.scale.set(5, 22, 1);
    beam2.position.set(-6,0,1);
    scene.add(beam2);

    var currentAccent = new THREE.Color(0xA35C00);
    var targetAccent = new THREE.Color(0xA35C00);

    function setAccent(hex){
      targetAccent.setHex(hex);
    }

    var THEMES = {
      dark:  {bg:0x10172a, dot:0x8293ab, dotOpacity:1,    line:0x8db4ca, lineOpacity:0.13, beamMul:1,    pingMul:1,    additive:true},
      light: {bg:0xF3EEE3, dot:0x0B1220, dotOpacity:0.24, line:0x0B1220, lineOpacity:0.2,  beamMul:0.16, pingMul:0.26, additive:false}
    };
    var currentBG = new THREE.Color(THEMES.dark.bg);
    var targetBG = new THREE.Color(THEMES.dark.bg);
    var currentDot = new THREE.Color(THEMES.dark.dot);
    var targetDot = new THREE.Color(THEMES.dark.dot);
    var currentLine = new THREE.Color(THEMES.dark.line);
    var targetLine = new THREE.Color(THEMES.dark.line);
    var mix = {dotOpacity:THEMES.dark.dotOpacity, lineOpacity:THEMES.dark.lineOpacity, beamMul:THEMES.dark.beamMul, pingMul:THEMES.dark.pingMul};
    var targetMix = {dotOpacity:THEMES.dark.dotOpacity, lineOpacity:THEMES.dark.lineOpacity, beamMul:THEMES.dark.beamMul, pingMul:THEMES.dark.pingMul};

    function setTheme(name){
      var th = THEMES[name] || THEMES.dark;
      targetBG.setHex(th.bg);
      targetDot.setHex(th.dot);
      targetLine.setHex(th.line);
      targetMix.dotOpacity = th.dotOpacity;
      targetMix.lineOpacity = th.lineOpacity;
      targetMix.beamMul = th.beamMul;
      targetMix.pingMul = th.pingMul;
      var blend = th.additive ? THREE.AdditiveBlending : THREE.NormalBlending;
      mat.blending = blend;
      lineMat.blending = blend;
      beamMat.blending = blend;
      beamMat2.blending = blend;
      pingSprites.forEach(function(s){ s.material.blending = blend; });
    }
    window.__bg = {setAccent:setAccent, setTheme:setTheme};

    var initialSlide = SLIDES[idx];
    if(initialSlide){
      targetAccent.setHex((ACCENTS[initialSlide.chapter] || ACCENTS.neutral).hex);
      currentAccent.copy(targetAccent);
    }
    setTheme((initialSlide && initialSlide.theme) || 'dark');
    currentBG.copy(targetBG);
    currentDot.copy(targetDot);
    currentLine.copy(targetLine);
    mix.dotOpacity = targetMix.dotOpacity;
    mix.lineOpacity = targetMix.lineOpacity;
    mix.beamMul = targetMix.beamMul;
    mix.pingMul = targetMix.pingMul;
    renderer.setClearColor(currentBG, 1);
    scene.fog.color.copy(currentBG);

    var mouseX = 0, mouseY = 0;
    if(!reduced){
      window.addEventListener('pointermove', function(e){
        mouseX = (e.clientX/window.innerWidth)*2-1;
        mouseY = (e.clientY/window.innerHeight)*2-1;
      });
    }

    function onResize(){
      camera.aspect = window.innerWidth/window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);

    var clock = new THREE.Clock();
    var colorAttr = geo.getAttribute('color');

    var pingPeriod = 2.6;
    function frame(){
      var dt = clock.getDelta();
      var t = clock.elapsedTime;

      if(!reduced){
        group.rotation.y += dt*0.065;
        camera.position.x = Math.sin(t*0.06)*1.1 + mouseX*0.7;
        camera.position.y = Math.cos(t*0.05)*0.6 - mouseY*0.45;
        camera.lookAt(0,0,-1);

        beam.position.y = ((t*0.5) % 20) - 10;
        beam.material.opacity = (0.1 + 0.08*Math.sin(t*1.3)*Math.sin(t*1.3)) * mix.beamMul;

        beam2.position.x = ((t*0.42 + 6) % 20) - 10;
        beam2.material.opacity = (0.06 + 0.07*Math.sin(t*1.1+1.4)*Math.sin(t*1.1+1.4)) * mix.beamMul;
      }

      currentAccent.lerp(targetAccent, 0.05);
      currentBG.lerp(targetBG, 0.09);
      currentDot.lerp(targetDot, 0.09);
      currentLine.lerp(targetLine, 0.09);
      mix.dotOpacity += (targetMix.dotOpacity-mix.dotOpacity)*0.09;
      mix.lineOpacity += (targetMix.lineOpacity-mix.lineOpacity)*0.09;
      mix.beamMul += (targetMix.beamMul-mix.beamMul)*0.09;
      mix.pingMul += (targetMix.pingMul-mix.pingMul)*0.09;

      renderer.setClearColor(currentBG, 1);
      scene.fog.color.copy(currentBG);
      mat.opacity = mix.dotOpacity;
      lineMat.color.copy(currentLine);
      lineMat.opacity = mix.lineOpacity;
      beamMat.color.copy(currentAccent);
      beamMat2.color.copy(currentAccent);

      var changed = false;
      for(var fi2=0; fi2<flaggedIdx.length; fi2++){
        var ii = flaggedIdx[fi2];
        var cr = colorAttr.array[ii*3], cg = colorAttr.array[ii*3+1], cb = colorAttr.array[ii*3+2];
        var nr = cr + (currentAccent.r - cr)*0.05;
        var ng = cg + (currentAccent.g - cg)*0.05;
        var nb = cb + (currentAccent.b - cb)*0.05;
        colorAttr.array[ii*3]=nr; colorAttr.array[ii*3+1]=ng; colorAttr.array[ii*3+2]=nb;
        changed = true;

        if(!reduced){
          var phase = (((t*0.5)+fi2*0.41) % pingPeriod)/pingPeriod;
          var sprite = pingSprites[fi2];
          sprite.position.set(positions[ii*3], positions[ii*3+1], positions[ii*3+2]);
          var sc = 0.4 + phase*2.6;
          sprite.scale.set(sc,sc,1);
          sprite.material.opacity = (1-phase)*0.5*mix.pingMul;
          sprite.material.color.copy(currentAccent);
        }
      }

      if(!reduced){
        for(var ni=0; ni<N; ni++){
          if(isFlagged[ni]) continue;
          var tw = 0.82 + 0.18*Math.sin(t*1.6 + ni*1.37);
          colorAttr.array[ni*3] = currentDot.r*tw;
          colorAttr.array[ni*3+1] = currentDot.g*tw;
          colorAttr.array[ni*3+2] = currentDot.b*tw;
        }
        changed = true;
      }
      if(changed) colorAttr.needsUpdate = true;

      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  }

  try{ initBG(); }catch(e){}

})();
</script>
